# Demo data, loaded by Brkmn::DemoData (lib/brkmn/demo_data.rb).
# See "Demo data" in README.md.
#
# Times are "how long ago": "3 days" means three days before the data is loaded.
# Every user gets the email <key>@demo.brkmn.test.

users:
  - key: admin
    name: Ada Admin
    superadmin: true
    about: superadmin, can edit and delete every link
  - key: maya
    name: Maya Chen
    about: owns the research links, has access requests to answer
  - key: jonas
    name: Jonas Weber
    about: owns the event links, can edit some of Maya's
  - key: priya
    name: Priya Natarajan
    about: communications, owns the most clicked links
  - key: sam
    name: Sam Okafor
    about: waits for edit access, an older request was denied
  - key: lea
    name: Lea Novak
    about: new, no links yet, was just denied access
  - key: tom
    name: Tom Locked
    state: locked
    about: locked after too many wrong passwords
  - key: nora
    name: Nora Pending
    state: unconfirmed
    about: signed up but never confirmed the email
  # External people with API access only, they can't sign in to the website.
  - key: partner
    name: Pat Partner
    api_only: true
    about: external partner, API only, uses a token an admin made for them
  - key: vendor
    name: Vic Vendor
    api_only: true
    about: external, API only, hasn't collected the token from the claim link yet

